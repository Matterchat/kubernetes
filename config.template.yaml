apiVersion: v1
kind: ConfigMap
metadata:
  name: matterchat-config
  namespace: matterchat
data:
  KEYCLOAK_CLIENT_ID: "${KEYCLOAK_CLIENT_ID}"
  KEYCLOAK_ISSUER: "${KEYCLOAK_ISSUER}"
  URLS_REDIS: "${URLS_REDIS}"
  URLS_API: "${URLS_API}"
  URLS_GATEWAY: "${URLS_GATEWAY}"
  LIVEKIT_URL: "${LIVEKIT_URL}"
  AUTH_URL: "${AUTH_URL}"
  AUTH_TRUST_HOST: "${AUTH_TRUST_HOST}"
  S3_ENDPOINT: "${S3_ENDPOINT}"
  S3_PUBLIC_URL: "${S3_PUBLIC_URL}"
---
apiVersion: v1
kind: Secret
metadata:
  name: matterchat-secrets
  namespace: matterchat
type: Opaque
data:
  DATABASE_URL: "${DATABASE_URL_BASE64}"
  KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET_BASE64}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD_BASE64}"
  AUTH_SECRET: "${AUTH_SECRET_BASE64}"
  LIVEKIT_KEYS: "${LIVEKIT_KEYS_BASE64}"
  MINIO_ROOT_USER: "${MINIO_ROOT_USER_BASE64}"
  MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD_BASE64}"
  S3_ACCESS_KEY: "${S3_ACCESS_KEY_BASE64}"
  S3_SECRET_KEY: "${S3_SECRET_KEY_BASE64}"
