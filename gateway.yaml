apiVersion: v1
kind: Service
metadata:
  name: matterchat-gateway-svc
  namespace: matterchat
  labels:
    app: matterchat-gateway
spec:
  ports:
    - port: 80
      targetPort: 5002
      protocol: TCP
  selector:
    app: matterchat-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matterchat-gateway
  namespace: matterchat
  labels:
    app: matterchat-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: matterchat-gateway
  template:
    metadata:
      labels:
        app: matterchat-gateway
    spec:
      serviceAccountName: matterchat-app-sa
      initContainers:
        - name: wait-for-migration
          image: bitnami/kubectl:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for database migration job to complete..."
              kubectl wait --namespace=matterchat --for=condition=complete --timeout=300s job/matterchat-db-migrate
      containers:
        - name: gateway
          image: registry.cloud.martinpetr.dev/matterchat/gateway:sha-9eb2d41
          imagePullPolicy: Always
          ports:
            - containerPort: 5002
              name: http
          envFrom:
            - configMapRef:
                name: matterchat-config
            - secretRef:
                name: matterchat-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5002
            initialDelaySeconds: 15
            periodSeconds: 20
