apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-server-config
  namespace: matterchat
data:
  livekit.yaml: |
    port: 7880
    logging:
      level: info
      pion_level: error
    rtc:
      tcp_port: 7881
      udp_port: 7882
      use_external_ip: false
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-svc
  namespace: matterchat
  labels:
    app: livekit
spec:
  ports:
    - name: http
      port: 7880
      targetPort: 7880
      protocol: TCP
    - name: turn-tcp
      port: 7881
      targetPort: 7881
      protocol: TCP
    - name: rtc-udp
      port: 7882
      targetPort: 7882
      protocol: UDP
  selector:
    app: livekit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: matterchat
  labels:
    app: livekit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      containers:
        - name: livekit
          image: livekit/livekit-server:latest
          command: ["/livekit-server", "--config", "/etc/livekit/livekit.yaml"]
          ports:
            - containerPort: 7880
              name: http
            - containerPort: 7881
              name: turn-tcp
            - containerPort: 7882
              name: rtc-udp
          env:
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef:
                  name: matterchat-secrets
                  key: LIVEKIT_KEYS
          volumeMounts:
            - name: config-volume
              mountPath: /etc/livekit
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
      volumes:
        - name: config-volume
          configMap:
            name: livekit-server-config
