apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: matterchat-web-ingress
  namespace: matterchat
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`matterchat.martinpetr.dev`)
      kind: Rule
      services:
        - name: matterchat-web-svc
          port: 80
  tls:
    certResolver: cloudflare
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: matterchat-api-ingress
  namespace: matterchat
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`api.matterchat.martinpetr.dev`)
      kind: Rule
      services:
        - name: matterchat-api-svc
          port: 80
  tls:
    certResolver: cloudflare
---
